services:
  seekdb:
    image: oceanbase/seekdb:latest
    container_name: seekdb-kb
    ports:
      - "127.0.0.1:2881:2881"
    environment:
      MEMORY_LIMIT: 2G
      DATAFILE_SIZE: 512M
      DATAFILE_MAXSIZE: 2G
      LOG_DISK_SIZE: 2G
    volumes:
      - seekdb-data:/var/lib/oceanbase
    restart: unless-stopped

volumes:
  seekdb-data:
