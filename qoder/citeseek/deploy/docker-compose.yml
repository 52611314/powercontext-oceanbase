name: citeseek

services:
  seekdb:
    image: oceanbase/seekdb:latest
    environment:
      MEMORY_LIMIT: 2G
      DATAFILE_SIZE: 512M
      DATAFILE_MAXSIZE: 2G
      LOG_DISK_SIZE: 2G
    ports:
      - "127.0.0.1:2881:2881"
    volumes:
      - seekdb-data:/var/lib/seekdb
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -P2881 -uroot --silent"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 40s
    restart: unless-stopped

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      CITESEK_SEEKDB_HOST: seekdb
      CITESEK_SEEKDB_PORT: "2881"
      CITESEK_SEEKDB_USER: root
      CITESEK_SEEKDB_PASSWORD: ""
      CITESEK_SEEKDB_DB: citeseek
      CITESEK_DATA_DIR: /data
      CITESEK_WEB_DIR: /app/frontend/dist
    volumes:
      - ../data:/data
    ports:
      - "8080:8000"
    depends_on:
      seekdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  seekdb-data:
