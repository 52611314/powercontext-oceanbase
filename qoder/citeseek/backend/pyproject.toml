[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citeseek"
version = "0.1.0"
description = "CiteSeek - 文献与资料检索工作台"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pypdf>=5.0",
  "onnxruntime>=1.19",
  "tokenizers>=0.20",
  "numpy>=1.26",
  "pymysql>=1.1",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/citeseek"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
